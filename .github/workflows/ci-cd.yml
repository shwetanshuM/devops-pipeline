name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t devops-assignment:${{ github.sha }} .

      - name: Deploy container
        run: |
          docker run -d -p 8000:8000 --name svc devops-assignment:${{ github.sha }}

      - name: Smoke test
        run: |
          for i in {1..10}; do
            if curl -fs http://localhost:8000/health; then
              echo ""
              echo "Service is healthy"
              exit 0
            fi
            echo "Waiting for service..."
            sleep 2
          done
          echo "Service failed to start"
          docker logs svc
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f svc